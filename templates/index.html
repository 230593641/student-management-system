<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生成绩管理系统</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
</head>
<body>
  <!-- 顶部渐变横幅 -->
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-text">
        <h1>🎓 学生成绩管理系统</h1>
        <p>Flask + MySQL · 数据可视化 · 一站式成绩管理</p>
      </div>
      <div class="hero-badge" id="heroDate"></div>
    </div>
  </header>

  <div class="container">

    <!-- KPI 卡片 -->
    <section class="kpi">
      <div class="kpi-card blue">
        <div class="kpi-icon">👥</div>
        <div><div class="kpi-num" id="stTotal">-</div><div class="kpi-label">学生总数</div></div>
      </div>
      <div class="kpi-card green">
        <div class="kpi-icon">📘</div>
        <div><div class="kpi-num" id="stCAvg">-</div><div class="kpi-label">C语言 平均分</div></div>
      </div>
      <div class="kpi-card orange">
        <div class="kpi-icon">🧩</div>
        <div><div class="kpi-num" id="stDsAvg">-</div><div class="kpi-label">数据结构 平均分</div></div>
      </div>
      <div class="kpi-card purple">
        <div class="kpi-icon">🏆</div>
        <div><div class="kpi-num" id="stTop">-</div><div class="kpi-label">班级最高分</div></div>
      </div>
    </section>

    <!-- 图表区 -->
    <section class="charts">
      <div class="chart-card">
        <h2>📊 各科成绩对比</h2>
        <div id="chartBar" class="chart"></div>
      </div>
      <div class="chart-card">
        <h2>🥧 成绩分数段分布</h2>
        <div id="chartPie" class="chart"></div>
      </div>
    </section>

    <!-- 操作区 -->
    <section class="ops">
      <div class="panel">
        <h2>➕ 新增学生</h2>
        <form id="addForm" class="form-row">
          <input name="id" placeholder="学号" maxlength="11" required>
          <input name="name" placeholder="姓名" maxlength="19" required>
          <input name="c_score" type="number" min="0" max="100" placeholder="C语言" required>
          <input name="ds_score" type="number" min="0" max="100" placeholder="数据结构" required>
          <button type="submit" class="btn primary">录入</button>
        </form>
      </div>
      <div class="panel">
        <h2>🔍 查询学生</h2>
        <div class="form-row">
          <select id="searchType">
            <option value="id">按学号</option>
            <option value="name">按姓名(模糊)</option>
          </select>
          <input id="searchInput" placeholder="输入关键字" maxlength="19">
          <button id="searchBtn" class="btn">查询</button>
          <button id="resetBtn" class="btn ghost">显示全部</button>
        </div>
      </div>
      <div class="panel">
        <h2>↕️ 排序</h2>
        <div class="form-row">
          <select id="sortField">
            <option value="average" selected>按平均分</option>
            <option value="c_score">按C语言</option>
            <option value="ds_score">按数据结构</option>
            <option value="id">按学号</option>
          </select>
          <select id="sortOrder">
            <option value="desc" selected>降序</option>
            <option value="asc">升序</option>
          </select>
          <button id="sortBtn" class="btn">排序</button>
        </div>
      </div>
    </section>

    <!-- 学生列表 -->
    <section class="list">
      <div class="list-head">
        <h2>📋 学生列表</h2>
        <span id="listTotal" class="badge"></span>
      </div>
      <div class="table-wrap">
        <table id="studentTable">
          <thead>
            <tr><th>名次</th><th>学号</th><th>姓名</th><th>C语言</th><th>数据结构</th><th>平均分</th><th>操作</th></tr>
          </thead>
          <tbody id="studentBody"></tbody>
        </table>
      </div>
      <p id="emptyTip" class="empty hidden">暂无数据，请先录入学生。</p>
    </section>
  </div>

  <!-- 编辑弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h2>编辑学生 <span id="editId"></span></h2>
      <form id="editForm" class="form-col">
        <label>姓名 <input name="name" maxlength="19" required></label>
        <label>C语言成绩 <input name="c_score" type="number" min="0" max="100" required></label>
        <label>数据结构成绩 <input name="ds_score" type="number" min="0" max="100" required></label>
        <div class="modal-actions">
          <button type="button" id="editCancel" class="btn ghost">取消</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/js/app.js"></script>
</body>
</html>
